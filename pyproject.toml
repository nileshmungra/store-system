[project]
name = "bhumi-store-system"
version = "1.0.0"
description = "Bhumi Factory & Dispatch Manager - Inventory management system"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Bhumi Factory Team"}]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "mysql-connector-python>=8.4.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
