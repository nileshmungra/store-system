<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Mobile QR Scanner</title>
    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --dark-bg: #090d16;
            --card-bg: #131a2b;
            --input-bg: #1e293b;
            --border-color: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
        }

        body {
            background-color: var(--dark-bg);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
        }

        .mobile-nav {
            background-color: rgba(19, 26, 43, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-pill-custom {
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-pill-custom.active {
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .form-control-custom {
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 15px;
        }

        .form-control-custom:focus {
            background-color: #1e293b;
            border-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Camera Box Container Styling */
        #reader {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        /* Customize html5-qrcode internal buttons */
        #reader button {
            background-color: #0284c7 !important;
            color: white !important;
            border: none !important;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            margin: 5px !important;
        }

        #reader select {
            background-color: var(--input-bg) !important;
            color: white !important;
            border: 1px solid var(--border-color) !important;
            padding: 8px !important;
            border-radius: 8px !important;
            margin-bottom: 10px !important;
            width: 90% !important;
        }

        /* Preset Quick Quantity Buttons */
        .btn-preset {
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            font-weight: 700;
            border-radius: 8px;
            padding: 6px 12px;
            transition: all 0.2s;
        }

        .btn-preset:hover,
        .btn-preset:active {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Approval Modal Customization */
        .modal-content-custom {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
        }

        /* Live Health Badge */
        .live-badge {
            background-color: #10b981;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* DP Progress Card Styling */
        #dpProgressContainer {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .progress-item {
            border-bottom: 1px solid var(--border-color);
            padding: 8px 4px;
        }

        .progress-item:last-child {
            border-bottom: none;
        }

        .item-name-truncate {
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            vertical-align: middle;
        }

        .progress-bar-custom {
            height: 8px;
            border-radius: 4px;
            background-color: #334155;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            transition: width 0.5s ease-in-out;
        }

        .dp-completed-overlay {
            background: rgba(16, 185, 129, 0.85);
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar (Routes Updated) -->
    <div class="mobile-nav p-2.5 d-flex justify-content-between align-items-center px-3 mb-3">
        <div class="d-flex gap-2">
            <a href="/scanner" class="nav-pill-custom active"><i class="bi bi-qr-code-scan me-1"></i> Scanner</a>
            <a href="/report-page" class="nav-pill-custom"><i class="bi bi-bar-chart-line me-1"></i> Reports</a>
            <a href="/dashboard" class="nav-pill-custom"><i class="bi bi-speedometer2 me-1"></i> Home</a>
        </div>
        <span class="live-badge"><i class="bi bi-wifi me-1"></i> LIVE</span>
    </div>

    <div class="container px-3">
        <div class="text-center mb-3">
            <h4 class="fw-extrabold text-white m-0"><i class="bi bi-camera-fill text-info me-2"></i> Store Outward
                Scanner</h4>
            <small class="text-slate-400">QR કોડ સ્કેન કરીને સામાન આઉટ કરો</small>
        </div>

        <!-- Outward Details Form -->
        <div class="card card-custom p-3.5 mb-3">
            <div class="mb-3">
                <label class="form-label text-warning fw-bold small mb-1">
                    <i class="bi bi-person-fill me-1"></i> માલ કોના માટે બહાર જાય છે? (Issued To) *
                </label>
                <input type="text" id="issuedTo" class="form-control form-control-custom"
                    placeholder="ઉદા. Production Dept / Ramesh Bhai" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-info fw-bold small mb-1">
                    <i class="bi bi-truck me-1"></i> Dispatch Plan (જો DP મુજબ માલ જાય તો)
                </label>
                <select id="dispatchPlanSelect" class="form-select form-control-custom">
                    <option value="">-- Manual Outward (No DP) --</option>
                </select>
            </div>
            <div>
                <label class="form-label text-slate-400 small mb-1">
                    <i class="bi bi-person-badge me-1"></i> સ્કેનર વાપરનાર (Scanned By)
                </label>
                <input type="text" id="scannedBy" class="form-control form-control-custom" value="Store Keeper">
            </div>
        </div>

        <!-- DP Progress Display Area -->
        <div id="dpProgressContainer" class="mb-3 p-3" style="display: none;"></div>

        <!-- Live Status Message Banner -->
        <div id="result" class="mb-3 text-center fw-bold fs-6"></div>

        <!-- Camera Viewfinder -->
        <div id="reader" class="bg-black"></div>
    </div>

    <!-- Approval Popup Modal -->
    <div class="modal fade" id="approvalModal" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom text-white shadow-lg">
                <div class="modal-header border-bottom border-secondary py-3">
                    <h5 class="modal-title text-warning fw-bold m-0"><i class="bi bi-check-circle-fill me-2"></i>
                        Outward Confirmation</h5>
                </div>
                <div class="modal-body fs-6 py-3">
                    <p class="mb-2 text-slate-300">શું તમે આ સામાન બહાર મોકલવાની મંજૂરી આપો છો?</p>

                    <!-- Box Details Container -->
                    <div class="bg-slate-800 p-3 rounded-3 border border-secondary text-start my-2"
                        style="background-color: #1e293b;">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-slate-400 small">Box ID:</span>
                            <span id="modalBoxId" class="badge bg-info text-dark fs-6 font-monospace"></span>
                        </div>
                        <div class="mb-1">
                            <span class="text-slate-400 small">Item Name:</span>
                            <strong id="modalItemName" class="text-white d-block fs-6"></strong>
                        </div>
                        <div class="mb-1">
                            <span class="text-slate-400 small">Issued To:</span>
                            <strong id="modalIssuedTo" class="text-warning d-block"></strong>
                        </div>
                        <div class="small text-slate-300 mt-2 border-top border-secondary pt-2">
                            બોક્સમાં ઉપલબ્ધ બાકી સ્ટોક: <span id="modalMaxQty" class="badge bg-success"></span>
                        </div>

                        <!-- Quantity Selection Input & Presets -->
                        <div class="mt-3">
                            <label class="form-label fw-bold text-warning small mb-1">Outward Qty (જેટલો જથ્થો આપવો હોય
                                તે):</label>
                            <input type="number" id="modalQty"
                                class="form-control form-control-custom fw-extrabold text-warning fs-5" min="1"
                                oninput="validateQtyInput(this)" required>

                            <!-- Quick Presets -->
                            <div class="d-flex gap-2 mt-2">
                                <button type="button" class="btn btn-preset btn-sm flex-fill"
                                    onclick="setPresetQty(1)">1 Pc</button>
                                <button type="button" class="btn btn-preset btn-sm flex-fill"
                                    onclick="setPresetQty(2)">2 Pcs</button>
                                <button type="button" class="btn btn-preset btn-sm flex-fill"
                                    onclick="setPresetQty(5)">5 Pcs</button>
                                <button type="button" class="btn btn-preset btn-sm flex-fill" onclick="setMaxQty()">Full
                                    Box</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top border-secondary py-2">
                    <button type="button" class="btn btn-outline-light btn-sm px-3" onclick="cancelScan()">❌
                        Cancel</button>
                    <button type="button" class="btn btn-success fw-bold px-4" id="confirmOutBtn"
                        onclick="confirmAndOut()">✅ Approve & Issue Out</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let pendingBoxId = "";
        let maxBoxQty = 0;
        let html5QrcodeScanner = null;
        let approvalModal = new bootstrap.Modal(document.getElementById('approvalModal'));

        document.addEventListener('DOMContentLoaded', function () {
            loadDispatchPlans();
            document.getElementById('dispatchPlanSelect').addEventListener('change', handleDpSelection);
        });

        async function loadDispatchPlans() {
            const selectEl = document.getElementById('dispatchPlanSelect');
            try {
                const res = await fetch(`${API_URL}/api/dispatch-plans/list`);
                const data = await res.json();
                if (res.ok && data.plans) {
                    const activePlans = data.plans.filter(p => p.status !== 'COMPLETED');
                    activePlans.forEach(plan => {
                        selectEl.innerHTML += `<option value="${plan.id}">${plan.plan_no} (SO: ${plan.so_no})</option>`;
                    });
                }
            } catch (e) { console.error("Could not load dispatch plans", e); }
        }

        function handleDpSelection() {
            const planId = document.getElementById('dispatchPlanSelect').value;
            const progressContainer = document.getElementById('dpProgressContainer');
            if (planId) {
                progressContainer.style.display = 'block';
                loadAndDisplayDpProgress(planId);
            } else {
                progressContainer.style.display = 'none';
                progressContainer.innerHTML = '';
            }
        }

        async function loadAndDisplayDpProgress(planId) {
            const container = document.getElementById('dpProgressContainer');
            container.innerHTML = `<div class="text-center py-3"><span class="spinner-border spinner-border-sm text-info"></span> DP પ્રોગ્રેસ લોડ થાય છે...</div>`;

            try {
                const res = await fetch(`${API_URL}/api/dispatch-plan/${planId}`);
                if (!res.ok) {
                    container.innerHTML = `<div class="alert alert-danger m-0">DP પ્રોગ્રેસ લોડ કરી શકાયો નથી.</div>`;
                    return;
                }
                const data = await res.json();
                const plan = data.plan;

                const totalPlanned = plan.items.reduce((sum, item) => sum + parseFloat(item.planned_qty), 0);
                const totalDispatched = plan.items.reduce((sum, item) => sum + parseFloat(item.dispatched_qty), 0);
                const overallProgress = totalPlanned > 0 ? (totalDispatched / totalPlanned) * 100 : 0;

                let itemsHtml = plan.items.map(item => {
                    const remaining = Math.max(0, parseFloat(item.planned_qty) - parseFloat(item.dispatched_qty));
                    const isDone = remaining <= 0;
                    return `
                        <div class="progress-item d-flex justify-content-between align-items-center small">
                            <div>
                                <span class="fw-bold ${isDone ? 'text-success text-decoration-line-through' : 'text-white'}">
                                    ${isDone ? '<i class="bi bi-check-circle-fill me-1"></i>' : ''}
                                    <span class="item-name-truncate" title="${item.item_name}">${item.item_name}</span>
                                </span>
                            </div>
                            <div class="text-end">
                                <span class="badge ${isDone ? 'bg-success' : 'bg-info text-dark'} font-monospace">
                                    ${parseFloat(item.dispatched_qty)} / ${parseFloat(item.planned_qty)} ${item.unit}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold text-info m-0"><i class="bi bi-list-check me-1"></i> DP Progress: ${plan.plan_no}</h6>
                        <span class="fw-extrabold text-white fs-6">${overallProgress.toFixed(1)}%</span>
                    </div>
                    <div class="progress-bar-custom mb-3">
                        <div class="progress-bar-fill" style="width: ${overallProgress.toFixed(1)}%;"></div>
                    </div>
                    <div class="position-relative">
                        <div style="max-height: 180px; overflow-y: auto;">
                            ${itemsHtml || '<div class="text-muted small text-center p-3">આ પ્લાનમાં કોઈ આઈટમ નથી.</div>'}
                        </div>
                        ${overallProgress >= 100 ? `
                            <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center dp-completed-overlay">
                                <h4 class="fw-extrabold text-white m-0">
                                    <i class="bi bi-award-fill me-2"></i> DP Plan Completed!
                                </h4>
                            </div>
                        ` : ''}
                    </div>
                `;

            } catch (e) {
                console.error("Error loading DP progress:", e);
                container.innerHTML = `<div class="alert alert-danger m-0">Server Error. DP પ્રોગ્રેસ લોડ કરી શકાયો નથી.</div>`;
            }
        }

        // Audio Beep Feedback
        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        // Live Validate Max Qty Input
        function validateQtyInput(input) {
            let val = parseInt(input.value);
            if (val > maxBoxQty) {
                input.value = maxBoxQty;
            } else if (val < 1 || isNaN(val)) {
                input.value = 1;
            }
        }

        async function onScanSuccess(decodedText, decodedResult) {
            const issuedTo = document.getElementById('issuedTo').value.trim();
            const dispatchPlanId = document.getElementById('dispatchPlanSelect').value;
            const resultDiv = document.getElementById('result');

            if (!issuedTo && !dispatchPlanId) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                resultDiv.className = "mb-3 text-center fw-bold text-warning p-2 bg-dark rounded border border-warning shadow-sm";
                resultDiv.innerText = "⚠️ કૃપા કરીને પહેલા 'Issued To' (માલ કોના માટે બહાર જાય છે) માં નામ લખો!";
                return;
            }

            if (navigator.vibrate) navigator.vibrate(100);
            playBeepSound();

            html5QrcodeScanner.pause();
            resultDiv.className = "mb-3 text-center fw-bold text-info p-2 bg-dark rounded border border-info shadow-sm";
            resultDiv.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>બોક્સ ચકાસી રહ્યું છે...`;

            try {
                let checkUrl = `${API_URL}/api/check-box/${decodedText}`;
                if (dispatchPlanId) {
                    checkUrl += `?dispatch_plan_id=${dispatchPlanId}`;
                }
                const checkRes = await fetch(checkUrl);
                const boxData = await checkRes.json();

                if (!checkRes.ok) {
                    resultDiv.className = "mb-3 text-center fw-bold text-danger fs-6 p-2 bg-dark rounded border border-danger shadow";
                    resultDiv.innerText = `❌ ${boxData.detail || 'બોક્સ મળ્યું નથી'}`;
                    setTimeout(() => {
                        resultDiv.innerText = "";
                        resultDiv.className = "mb-3 text-center fw-bold fs-6";
                        html5QrcodeScanner.resume();
                    }, 3000);
                    return;
                }

                pendingBoxId = decodedText;
                maxBoxQty = boxData.qty;

                document.getElementById('modalBoxId').innerText = decodedText;
                document.getElementById('modalItemName').innerText = boxData.item_name || 'N/A';

                let finalIssuedTo = issuedTo;
                if (dispatchPlanId && !issuedTo) {
                    const selectedOption = document.getElementById('dispatchPlanSelect').options[document.getElementById('dispatchPlanSelect').selectedIndex];
                    finalIssuedTo = `DP: ${selectedOption.text}`;
                }
                document.getElementById('modalIssuedTo').innerText = finalIssuedTo;

                document.getElementById('modalMaxQty').innerText = `${boxData.qty} Pcs`;

                document.getElementById('modalQty').value = boxData.qty;
                document.getElementById('modalQty').max = boxData.qty;

                resultDiv.innerText = "";
                resultDiv.className = "mb-3 text-center fw-bold fs-6";

                // ૧. જો ૧ જ Qty બાકી હોય તો મોડલમાં ખાસ Alert વોર્નિંગ બતાવો
                const modalBody = document.getElementById('modalMaxQty');
                if (boxData.qty === 1) {
                    modalBody.innerHTML = `1 Pc <span class="badge bg-danger ms-2">⚠️ LAST PIECE</span>`;
                } else {
                    modalBody.innerHTML = `${boxData.qty} Pcs`;
                }

                // ૨. Full Box વાળા બટન પર જથ્થો ડાયનેમિક બતાવો
                const fullBoxBtn = document.querySelector("button[onclick='setMaxQty()']");
                if (fullBoxBtn) {
                    fullBoxBtn.innerText = `Full Box (${boxData.qty})`;
                }
                approvalModal.show();

            } catch (error) {
                resultDiv.className = "mb-3 text-center fw-bold text-danger p-2 bg-dark rounded border border-danger";
                resultDiv.innerText = "❌ Server સાથે કનેક્શન થયું નથી.";
                setTimeout(() => {
                    resultDiv.innerText = "";
                    html5QrcodeScanner.resume();
                }, 2500);
            }
        }

        function setPresetQty(val) {
            if (val <= maxBoxQty) {
                document.getElementById('modalQty').value = val;
            } else {
                document.getElementById('modalQty').value = maxBoxQty;
            }
        }

        function setMaxQty() {
            document.getElementById('modalQty').value = maxBoxQty;
        }

        document.getElementById('approvalModal').addEventListener('shown.bs.modal', function () {
            const qtyInput = document.getElementById('modalQty');
            qtyInput.focus();
            qtyInput.select();
        });

        document.getElementById('modalQty').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmAndOut();
            }
        });

        async function confirmAndOut() {
            const issuedTo = document.getElementById('issuedTo').value.trim();
            const dispatchPlanId = document.getElementById('dispatchPlanSelect').value;
            const scannedBy = document.getElementById('scannedBy').value.trim();
            const qtyIssued = parseInt(document.getElementById('modalQty').value);

            let finalIssuedTo = issuedTo;
            if (dispatchPlanId && !issuedTo) {
                const selectedOption = document.getElementById('dispatchPlanSelect').options[document.getElementById('dispatchPlanSelect').selectedIndex];
                finalIssuedTo = `DP: ${selectedOption.text}`;
            }

            const resultDiv = document.getElementById('result');
            const confirmBtn = document.getElementById('confirmOutBtn');

            if (!qtyIssued || qtyIssued <= 0) {
                alert("⚠️ કૃપા કરીને માન્ય Qty નાખો!");
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Processing...`;

            try {
                const response = await fetch(`${API_URL}/api/outward`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        box_id: pendingBoxId,
                        qty_issued: qtyIssued,
                        issued_to: finalIssuedTo,
                        scanned_by: scannedBy,
                        dispatch_plan_id: dispatchPlanId || null
                    })
                });

                const data = await response.json();
                approvalModal.hide();

                if (response.ok) {
                    resultDiv.className = "mb-3 text-center p-3 bg-dark rounded border border-success shadow";
                    resultDiv.innerHTML = `
                        <div class="text-success fw-bold fs-6 mb-2">✅ ${data.message || 'સામાન સફળતાપૂર્વક આઉટ થયો!'}</div>
                        <button type="button" class="btn btn-primary fw-bold px-4 py-2 mt-1 shadow-sm" onclick="startNextScan()">
                            📸 Scan Next Box (બીજું બોક્સ સ્કેન કરો)
                        </button>
                    `;
                    // Refresh DP Progress if a plan is selected
                    if (dispatchPlanId) {
                        loadAndDisplayDpProgress(dispatchPlanId);
                    }
                } else {
                    resultDiv.className = "mb-3 text-center fw-bold text-danger fs-6 p-3 bg-dark rounded border border-danger shadow";
                    resultDiv.innerHTML = `
                        <div class="mb-2">❌ ${data.detail || 'એરર આવી છે'}</div>
                        <button type="button" class="btn btn-warning text-dark fw-bold px-3 py-1 btn-sm" onclick="startNextScan()">
                            🔄 Try Again (ફરીથી પ્રયાસ કરો)
                        </button>
                    `;
                }
            } catch (error) {
                approvalModal.hide();
                resultDiv.className = "mb-3 text-center fw-bold text-danger p-3 bg-dark rounded border border-danger";
                resultDiv.innerHTML = `
                    <div class="mb-2">❌ Server સાથે કનેક્શન થયું નથી.</div>
                    <button type="button" class="btn btn-warning text-dark fw-bold px-3 py-1 btn-sm" onclick="startNextScan()">
                        🔄 Try Again
                    </button>
                `;
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.innerText = "✅ Approve & Issue Out";
            }
        }

        // --- Next Scan Button Trigger ---
        function startNextScan() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "";
            resultDiv.className = "mb-3 text-center fw-bold fs-6";

            // બટન પર ટચ કર્યા પછી જ કેમેરા Resume થશે
            html5QrcodeScanner.resume();
        }

        // --- Cancel Scan Helper ---
        function cancelScan() {
            approvalModal.hide();
            showNextScanButton();
        }

        function showNextScanButton() {
            const resultDiv = document.getElementById('result');
            resultDiv.className = "mb-3 text-center p-2 bg-dark rounded border border-info shadow";
            resultDiv.innerHTML = `
                <button type="button" class="btn btn-info text-dark fw-bold px-4 py-2" onclick="startNextScan()">
                            📸 Scan Next Box (બીજું બોક્સ સ્કેન કરો)
                        </button>
                    `;
        }

        // --- Initialize Scanner ---
        html5QrcodeScanner = new Html5QrcodeScanner("reader", {
            fps: 15,
            qrbox: { width: 230, height: 230 },
            rememberLastUsedCamera: true,
            showTorchButtonIfSupported: true
        });

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>

</html>
